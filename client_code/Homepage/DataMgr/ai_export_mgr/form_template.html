<anvil-form container="ColumnPanel">
    <anvil-component type="Label" name="title_label" prop:align="center" prop:role="headline" prop:text="AI Export Manager"></anvil-component>
    <anvil-component type="FlowPanel" name="main_flow">
      <anvil-component type="ColumnPanel" name="left_panel" prop:role="outlined-card" prop:col_spacing="small" container:width="480">
        <anvil-component type="Label" name="list_title" prop:role="title" prop:text="Your Team's Exports"></anvil-component>
        <anvil-component type="Label" name="export_count_label" prop:font_size="12" prop:spacing_above="small" prop:spacing_below="none"></anvil-component>
        <anvil-component type="RepeatingPanel" name="export_list_panel" prop:spacing_above="none" prop:item_template="Homepage.DataMgr.ai_export_mgr.ai_export_row_template"></anvil-component>
      </anvil-component>
      <anvil-component type="ColumnPanel" name="right_panel" prop:role="elevated-card" prop:col_spacing="small" container:width="640">
        <anvil-component type="Label" name="mode_label" prop:align="center" prop:role="headline" prop:text="Add New Export"></anvil-component>

        <anvil-component type="FlowPanel" name="league_team_flow" prop:spacing_above="small">
          <anvil-component type="Label" name="league_label" prop:text="League:"></anvil-component>
          <anvil-component type="DropDown" name="league_dropdown" on:change="self.league_dropdown_change"></anvil-component>
          <anvil-component type="Label" name="team_label_title" prop:text="Team:" prop:spacing='{"padding":[null,null,null,"20"]}'></anvil-component>
          <anvil-component type="Label" name="team_label" prop:bold="true"></anvil-component>
        </anvil-component>

        <anvil-component type="TextBox" name="note_box" prop:placeholder="Title for this export" prop:spacing_above="small"></anvil-component>

        <anvil-component type="FlowPanel" name="dow_flow" prop:spacing_above="small">
          <anvil-component type="Label" name="dow_field_label" prop:text="Day of Week:"></anvil-component>
          <anvil-component type="DropDown" name="dow_dropdown"></anvil-component>
          <anvil-component type="CheckBox" name="enabled_checkbox" prop:text="Enabled" prop:checked="true" prop:spacing='{"padding":[null,null,null,"20"]}'></anvil-component>
        </anvil-component>

        <anvil-component type="Label" name="players_title" prop:role="title" prop:text="Players" prop:spacing_above="small"></anvil-component>
        <anvil-component type="anvil_extras.MultiSelectDropDown" name="player_select" prop:placeholder="All players in this league" prop:enable_filtering="true" prop:enable_select_all="true" prop:multiple="true" prop:width="100%"></anvil-component>

        <anvil-component type="Label" name="datasets_title" prop:role="title" prop:text="Datasets" prop:spacing_above="small"></anvil-component>
        <anvil-component type="anvil_extras.MultiSelectDropDown" name="dataset_select" prop:placeholder="Select datasets" prop:enable_filtering="false" prop:enable_select_all="true" prop:multiple="true" prop:width="100%"></anvil-component>

        <anvil-component type="FlowPanel" name="action_buttons_flow" prop:spacing_above="small">
          <anvil-component type="Button" name="primary_button" prop:role="outlined-button" prop:text="Add Export" on:click="self.primary_button_click"></anvil-component>
          <anvil-component type="Button" name="delete_button" prop:role="outlined-button" prop:text="Delete Export" prop:visible="false" on:click="self.delete_button_click"></anvil-component>
          <anvil-component type="Button" name="cancel_button" prop:role="outlined-button" prop:text="Cancel" on:click="self.cancel_button_click"></anvil-component>
        </anvil-component>
      </anvil-component>
    </anvil-component>
    <anvil-component type="Button" name="close_button" prop:role="outlined-button" prop:text="Close" on:click="self.close_button_click"></anvil-component>
</anvil-form>
